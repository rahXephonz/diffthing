name: Deploy landing

# Build the Astro landing site and deploy it to Cloudflare Pages. The build
# copies install.sh / install.ps1 into the site root, so the deployed site also
# serves the one-line installers at https://diffthing.dev/install.sh (+ .ps1).
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# and a Pages project named "diffthing-landing" (create once, empty/direct-upload).

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - "pnpm-lock.yaml"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Guard against forks trying to deploy to the owner's Cloudflare account.
    if: github.repository_owner == 'RahXephonz'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # landing/ is a pnpm-workspace member (see pnpm-workspace.yaml), so the
      # install runs from the repo root against the root pnpm-lock.yaml. The
      # --filter keeps it from also installing the web/ workspace deps.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter diffthing-landing...

      - name: Build
        working-directory: landing
        # Public Cloudflare Web Analytics token (repo Variable, not a secret —
        # it appears in page source). Unset => no beacon.
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
        run: pnpm build

      # Direct-upload deploy of the built dist/. --branch=main marks it as a
      # production deploy (set the Pages project's production branch to "main").
      - name: Deploy to Cloudflare Pages
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@3 pages deploy dist --project-name=diffthing-landing --branch=main
